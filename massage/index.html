<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<title>Kneaded</title>
<meta name="description" content="Learn and practice Eastern and Western massage techniques on your partner — guided routines, a technique library, and a practice log with feedback." />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Kneaded" />
<meta name="theme-color" content="#f6f1ea" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon-180.png" />
<link rel="icon" type="image/png" href="icon-180.png" />
<style>
  :root {
    --bg: #f6f1ea;
    --surface: #fffdf9;
    --surface-2: #efe8dd;
    --line: #e5dccd;
    --ink: #2b2620;
    --muted: #8a7f6e;
    --east: #b0562f;
    --east-soft: #f5e0d5;
    --west: #31656d;
    --west-soft: #dcebe9;
    --gold: #9c7a30;
    --gold-soft: #f1e7cf;
    --green: #3c7a52;
    --green-soft: #dfeee4;
    --red: #b23a3a;
    --red-soft: #f3dcdc;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    --serif: ui-serif, "New York", Georgia, serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--sans);
    line-height: 1.55; overscroll-behavior-y: none; -webkit-font-smoothing: antialiased;
  }
  #app {
    max-width: 640px; margin: 0 auto; min-height: 100%;
    padding: calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 96px);
  }
  header.appbar { margin-bottom: 14px; }
  .appbar h1 { font-family: var(--serif); font-size: 27px; letter-spacing: 0.2px; }
  .appbar h1 em { font-style: normal; color: var(--east); }
  .appbar p { color: var(--muted); font-size: 13.5px; margin-top: 1px; }

  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
    padding: 15px 16px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(43, 38, 32, 0.05);
  }
  .card.tappable { cursor: pointer; }
  .card.tappable:active { background: var(--surface-2); }
  .card h2 { font-family: var(--serif); font-size: 19px; line-height: 1.3; margin: 4px 0 2px; }
  .card .meta { color: var(--muted); font-size: 13px; }

  .badge {
    display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: 0.9px;
    text-transform: uppercase; padding: 2px 8px; border-radius: 20px; margin-right: 5px;
  }
  .badge.east { background: var(--east-soft); color: var(--east); }
  .badge.west { background: var(--west-soft); color: var(--west); }
  .badge.neutral { background: var(--surface-2); color: var(--muted); }
  .badge.green { background: var(--green-soft); color: var(--green); }
  .badge.gold { background: var(--gold-soft); color: var(--gold); }

  .dots { color: var(--east); letter-spacing: 2px; font-size: 12px; }
  .dots .off { color: var(--line); }

  .chips { display: flex; gap: 8px; margin: 2px 0 14px; overflow-x: auto; padding-bottom: 4px; }
  .chip {
    border: 1px solid var(--line); background: var(--surface); color: var(--muted);
    border-radius: 20px; padding: 7px 14px; font-size: 13.5px; font-weight: 600;
    cursor: pointer; white-space: nowrap; font-family: var(--sans);
  }
  .chip.on { background: var(--ink); border-color: var(--ink); color: #fff; }

  .btn {
    display: block; width: 100%; border: none; border-radius: 14px;
    padding: 14px 16px; font-size: 16px; font-weight: 600; cursor: pointer; font-family: var(--sans);
  }
  .btn:active { opacity: 0.85; }
  .btn.primary { background: var(--ink); color: #fff; }
  .btn.east { background: var(--east); color: #fff; }
  .btn.subtle { background: var(--surface-2); color: var(--ink); }
  .btn.ghost { background: transparent; border: 1.5px dashed var(--line); color: var(--muted); }
  .btn.small { width: auto; display: inline-block; padding: 9px 14px; font-size: 14px; border-radius: 11px; }
  .btn + .btn { margin-top: 10px; }
  .btnrow { display: flex; gap: 10px; }
  .btnrow .btn { margin-top: 0; flex: 1; }

  .back {
    border: none; background: transparent; color: var(--muted); font-size: 15px;
    font-weight: 600; cursor: pointer; padding: 4px 0; margin-bottom: 8px; font-family: var(--sans);
  }

  .section-title {
    font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
    color: var(--muted); margin: 20px 0 8px;
  }

  ol.steps { margin: 8px 0 4px 0; padding-left: 0; list-style: none; counter-reset: st; }
  ol.steps li {
    counter-increment: st; position: relative; padding: 0 0 12px 38px; font-size: 15px;
  }
  ol.steps li::before {
    content: counter(st); position: absolute; left: 0; top: 1px;
    width: 26px; height: 26px; border-radius: 50%; background: var(--surface-2);
    color: var(--ink); font-size: 13px; font-weight: 700; display: flex;
    align-items: center; justify-content: center;
  }
  ul.plain { padding-left: 18px; font-size: 15px; }
  ul.plain li { margin-bottom: 7px; }

  .callout { border-radius: 12px; padding: 11px 13px; font-size: 14px; margin-top: 10px; }
  .callout.warn { background: var(--red-soft); color: #7c2a2a; }
  .callout.tip { background: var(--gold-soft); color: #6e5620; }

  .empty { text-align: center; color: var(--muted); padding: 36px 20px; }
  .empty .big { font-size: 40px; margin-bottom: 8px; }
  .empty h3 { color: var(--ink); font-size: 17px; margin-bottom: 4px; }
  .empty p { font-size: 14px; }

  /* stats */
  .statrow { display: flex; gap: 10px; margin-bottom: 12px; }
  .stat {
    flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 12px 8px; text-align: center;
  }
  .stat b { display: block; font-family: var(--serif); font-size: 22px; }
  .stat span { font-size: 11.5px; color: var(--muted); letter-spacing: 0.4px; text-transform: uppercase; font-weight: 600; }

  /* forms */
  label.fieldlabel {
    display: block; font-size: 12px; font-weight: 700; letter-spacing: 0.8px;
    text-transform: uppercase; color: var(--muted); margin: 16px 0 6px;
  }
  input[type=text], input[type=number], textarea {
    width: 100%; border: 1px solid var(--line); border-radius: 12px; background: var(--surface);
    padding: 12px 13px; font-size: 16px; font-family: var(--sans); color: var(--ink); outline: none;
  }
  input:focus, textarea:focus { border-color: var(--ink); }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); }
  .seg button {
    flex: 1; border: none; background: transparent; padding: 11px 4px; font-size: 14px;
    font-weight: 600; color: var(--muted); cursor: pointer; font-family: var(--sans);
  }
  .seg button.on { background: var(--ink); color: #fff; }

  /* runner */
  .runner { text-align: center; padding-top: 8vh; }
  .runner .stepno { color: var(--muted); font-size: 13px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
  .runner h2 { font-family: var(--serif); font-size: 28px; margin: 8px 0 6px; line-height: 1.25; }
  .runner .cue { color: var(--muted); font-size: 15.5px; max-width: 460px; margin: 0 auto 18px; }
  .clock { font-variant-numeric: tabular-nums; font-family: var(--serif); font-size: 64px; letter-spacing: 1px; margin: 6px 0 4px; }
  .clock.paused { color: var(--muted); }
  .runbar { height: 6px; border-radius: 3px; background: var(--surface-2); margin: 16px auto 26px; max-width: 420px; overflow: hidden; }
  .runbar i { display: block; height: 100%; background: var(--east); border-radius: 3px; transition: width 0.5s linear; }
  .runctl { display: flex; gap: 10px; max-width: 420px; margin: 0 auto; }
  .runctl .btn { flex: 1; margin: 0; }

  /* rating hearts */
  .hearts { display: flex; gap: 8px; }
  .hearts button {
    flex: 1; font-size: 24px; padding: 8px 0; border: 1px solid var(--line); border-radius: 12px;
    background: var(--surface); cursor: pointer; color: var(--line);
  }
  .hearts button.on { color: var(--east); border-color: var(--east-soft); background: var(--east-soft); }

  /* bottom nav */
  nav.tabs {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
    background: rgba(255, 253, 249, 0.94); backdrop-filter: blur(10px);
    border-top: 1px solid var(--line); display: flex;
    padding: 6px 8px calc(env(safe-area-inset-bottom) + 6px);
  }
  nav.tabs button {
    flex: 1; border: none; background: transparent; cursor: pointer; color: var(--muted);
    font-family: var(--sans); font-size: 11px; font-weight: 600; padding: 6px 2px 4px; border-radius: 10px;
  }
  nav.tabs button .ic { display: block; font-size: 21px; margin-bottom: 1px; }
  nav.tabs button.on { color: var(--east); }

  .logcard .notes { font-size: 14px; margin-top: 6px; }
  .kv { display: flex; justify-content: space-between; font-size: 14px; padding: 7px 0; border-bottom: 1px solid var(--line); }
  .kv:last-child { border-bottom: none; }
  .kv b { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabs" id="tabs"></nav>
<script>
"use strict";

/* ============================== DATA ============================== */

const TECHNIQUES = [
  /* ---------- WESTERN ---------- */
  {
    id: "effleurage", side: "west", tradition: "Swedish", name: "Effleurage — Gliding Strokes",
    areas: "Back · Legs · Arms", pressure: 2, oil: true, mins: "3–5 min",
    summary: "Long, flowing strokes with flat hands. The opener and closer of almost every Western massage — it spreads the oil, warms the tissue, and tells the nervous system it's safe to relax.",
    steps: [
      "Warm a little oil between your palms, then lay both hands flat at the lower back (or ankle).",
      "Glide slowly up the back either side of the spine — or up the limb toward the heart — keeping full palm contact.",
      "At the top, fan your hands outward and trail lightly back down the sides with almost no pressure.",
      "Repeat in a continuous loop, gradually adding a little more weight each pass.",
      "Keep one hand on your partner whenever you reach for more oil — unbroken contact is what makes it feel seamless."
    ],
    tips: [
      "Firm on the way up, feather-light on the way back — the rhythm is the massage.",
      "Slow down more than feels natural. Half your instinctive speed is about right.",
      "Use it between every other technique as a palate cleanser."
    ],
    cautions: "Glide beside the spine, never press on the bones themselves."
  },
  {
    id: "petrissage", side: "west", tradition: "Swedish", name: "Petrissage — Kneading",
    areas: "Shoulders · Glutes · Thighs · Calves", pressure: 3, oil: true, mins: "4–6 min",
    summary: "Rhythmic lifting, squeezing and rolling of muscle, like kneading bread dough. Best on fleshy areas — it wrings tension out of the muscle belly.",
    steps: [
      "Grasp a handful of muscle (top of the shoulder is the classic spot) between your fingers and the heel of your hand.",
      "Lift it slightly away from the bone, squeeze, then release as your other hand picks up the next handful.",
      "Alternate hands in a slow, circular rhythm — like kneading dough in place.",
      "Work along the whole muscle, then finish with a few gliding strokes to smooth it out."
    ],
    tips: [
      "Use your whole hand, not fingertips — pinching feels sharp, kneading feels deep.",
      "Ask once: “more or less?” — shoulders vary hugely between people.",
      "Keep your wrists relaxed; the motion comes from your arms rocking."
    ],
    cautions: "Skip areas with bruises or varicose veins."
  },
  {
    id: "friction", side: "west", tradition: "Swedish", name: "Friction — Small Circles",
    areas: "Around shoulder blades · Beside spine · Forearms", pressure: 3, oil: false, mins: "3–5 min",
    summary: "Small, focused circles or short cross-fiber strokes with thumbs or fingertips. This is the detail work — it targets specific knots and stubborn spots the broad strokes can't reach.",
    steps: [
      "Use little or no oil so your fingers don't slide off the spot.",
      "With thumb pads or the first two fingertips, make small slow circles about the size of a coin.",
      "Work the muscles either side of the spine and around the edges of the shoulder blades — you'll feel ropy or grainy spots.",
      "Spend 20–30 seconds on each spot, then smooth the area with a gliding stroke before moving on."
    ],
    tips: [
      "Move the skin over the muscle rather than rubbing across the skin — less burn, more depth.",
      "The best spots are usually where your partner says “right there.” Let them navigate.",
      "Brace your thumb with the other fingers to save your joints."
    ],
    cautions: "Circle beside the spine, never on the vertebrae. Ease off if anything feels sharp or tingly to your partner."
  },
  {
    id: "tapotement", side: "west", tradition: "Swedish", name: "Tapotement — Percussion",
    areas: "Upper back · Glutes · Thighs", pressure: 2, oil: false, mins: "1–2 min",
    summary: "Brisk rhythmic drumming with cupped hands or the edges of loose hands. Wakes tissue up and feels amazing on the upper back — the classic movie-massage move, used briefly.",
    steps: [
      "Cup your hands slightly, or use the pinky-edge of relaxed open hands.",
      "With loose, floppy wrists, drum alternately on the fleshy upper back — a quick, light, even rhythm.",
      "Keep it to fleshy, muscular areas and sweep across them for a minute or two at most.",
      "Finish with slow gliding strokes to settle everything back down."
    ],
    tips: [
      "Loose wrists are everything — if your forearms tire quickly, you're too stiff.",
      "Cupped hands should sound hollow, like a horse trotting, not slappy.",
      "Great near the end of a session to re-energize, or skip it entirely for a sleepy wind-down."
    ],
    cautions: "Never over the spine, the kidneys (the soft area just above the waist, beside the spine), or the back of the knees."
  },
  {
    id: "vibration", side: "west", tradition: "Swedish", name: "Vibration & Jostling",
    areas: "Arms · Legs · Whole back", pressure: 1, oil: false, mins: "1–2 min",
    summary: "Gentle shaking and rocking that coaxes a limb or the whole body to let go. Wonderful for partners who have trouble relaxing — you can feel the moment the tension surrenders.",
    steps: [
      "Rest your hands on a muscle (calf, forearm, or shoulder) and tremble your hands rapidly for a few seconds.",
      "Or lift a relaxed arm or leg slightly, and jostle it gently so the muscle wobbles.",
      "Try slow whole-body rocking: hands on the hip and shoulder, push gently and let them roll back, in a lullaby rhythm.",
      "If your partner is 'helping' you move the limb, pause and let them melt first."
    ],
    tips: [
      "This is the best tension detector: a truly relaxed limb feels heavy and loose.",
      "Rocking at about one push per second is deeply calming — same rhythm as rocking a child.",
      "Keep it playful and light; it should never feel like being shaken awake."
    ],
    cautions: ""
  },
  {
    id: "forearm-glide", side: "west", tradition: "Deep tissue", name: "Forearm Glide",
    areas: "Back · Hamstrings", pressure: 4, oil: true, mins: "3–5 min",
    summary: "Slow, heavy strokes using the flat of your forearm instead of your hands. This is how you give real depth without wrecking your thumbs — depth comes from body weight and slowness, not effort.",
    steps: [
      "Kneel or stand beside your partner. Oil the back well.",
      "Lay the soft, fleshy part of your forearm (not the bony elbow edge) flat on the lower back, beside the spine.",
      "Lean your body weight in gradually and glide slowly up toward the shoulder — take a full 10 seconds or more.",
      "Ask “how's that depth?” on the first pass, and adjust by leaning more or less.",
      "Repeat 3–4 passes each side, then smooth out with palm strokes."
    ],
    tips: [
      "Slower is deeper. The same pressure at half speed feels twice as deep.",
      "Keep your wrist and fist relaxed — a clenched fist stiffens the whole forearm.",
      "Stay on the thick muscle beside the spine; you should never feel bone under your arm."
    ],
    cautions: "Deep pressure is earned: only after the area is warmed up with lighter strokes. Never on the neck, spine, or lower back's soft kidney area."
  },
  {
    id: "trigger-point", side: "west", tradition: "Clinical / NMT", name: "Trigger Point Release",
    areas: "Shoulders · Upper back · Glutes", pressure: 4, oil: false, mins: "2–4 min",
    summary: "Find a knot, apply steady sustained pressure, and wait for it to soften. Borrowed from neuromuscular therapy — the technique for that one spot your partner always complains about.",
    steps: [
      "Explore with flat fingers until you find a tender, ropy knot — your partner will confirm it instantly.",
      "Press into it slowly with a supported thumb or knuckle, building to a “good hurt” — about 6–7 out of 10, never wincing.",
      "Hold completely still for 30–60 seconds while your partner breathes slowly. The ache usually fades as it releases.",
      "Ease off just as slowly, then soothe the area with gliding strokes.",
      "Two or three spots per session is plenty — this is seasoning, not the meal."
    ],
    tips: [
      "Ask your partner to rate the pressure 1–10 and stay at their 6–7.",
      "Exhaling into the pressure helps it release — breathe together.",
      "If the ache doesn't ease within a minute, let it go and move on. Not every knot yields today."
    ],
    cautions: "Melting ache is good; sharp, electric, or radiating pain means move off immediately. Never hold pressure on bone, the front of the neck, or anywhere with a pulse."
  },
  {
    id: "myofascial", side: "west", tradition: "Myofascial release", name: "Myofascial Skin Stretch",
    areas: "Back · Shoulders · IT band", pressure: 2, oil: false, mins: "3–4 min",
    summary: "Slow stretching of the skin and the connective-tissue layer beneath it — no oil, no sliding. Subtle to give and surprisingly profound to receive.",
    steps: [
      "Work on dry skin or through a thin sheet — you want grip, not glide.",
      "Lay both hands flat on the back a few inches apart, sink in gently, and slowly stretch them away from each other.",
      "Take the stretch to its comfortable end and just hold — after 30–60 seconds you'll feel the tissue slowly creep and soften.",
      "Follow the softening: let your hands drift with it rather than forcing further.",
      "Repeat across the back in different directions, like slowly stretching a sweater into shape."
    ],
    tips: [
      "The feel you're after is stretching dough — not sliding over it, not crushing it.",
      "This rewards patience like nothing else. If it feels boring to give, you're doing it right.",
      "Lovely as the very first technique of a session, before any oil goes on."
    ],
    cautions: ""
  },
  {
    id: "compression", side: "west", tradition: "Sports massage", name: "Compression Pumping",
    areas: "Back · Glutes · Thighs · Calves", pressure: 3, oil: false, mins: "2–3 min",
    summary: "Rhythmic pressing with flat palms, straight through clothes or a sheet. The perfect no-setup warm-up — it pumps fresh blood through the muscle before deeper work.",
    steps: [
      "With your partner lying face down (clothed is fine), place one palm flat on a big muscle, other hand stacked on top.",
      "Lean in with your body weight, then release — a slow pumping rhythm, about one press per second.",
      "Walk your hands along the whole back (staying beside the spine), then down each leg.",
      "Cover everything once or twice; the whole body should feel warmed and 'touched in' within a couple of minutes."
    ],
    tips: [
      "Press with body weight, arms straight — think CPR posture but far gentler.",
      "This is the ideal first technique of any session: zero oil, zero undressing, instant relaxation.",
      "Match the rhythm to your partner's breathing for a hypnotic effect."
    ],
    cautions: "Stay off the spine itself, the lower ribs' kidney area, and the back of the knees."
  },

  /* ---------- EASTERN ---------- */
  {
    id: "palming", side: "east", tradition: "Shiatsu · Japan", name: "Palming",
    areas: "Back · Legs · Sacrum", pressure: 3, oil: false, mins: "3–5 min",
    summary: "The heart of shiatsu: leaning steady body weight through soft, relaxed palms, one placement at a time. Done through clothes, no oil — pressure that feels like being held rather than rubbed.",
    steps: [
      "Partner lies face down on a mat or firm bed, comfortably clothed.",
      "Kneel beside them. Place one palm on the sacrum (the flat bone at the base of the spine) as an anchor.",
      "Place your other palm on the upper back beside the spine, arm straight, and slowly lean your body weight in.",
      "Hold for a slow breath, ease off, move the palm one hand-width down, and repeat — down the whole back and each leg.",
      "Keep the pressure perpendicular to the body and your arms relaxed — you're leaning, not pushing."
    ],
    tips: [
      "Shiatsu wisdom: pressure should arrive slowly, stay stationary, and leave slowly.",
      "Sync with their breath — lean in on their exhale.",
      "Soft hands, straight arms, weight from your center. If your shoulders tire, you're pushing instead of leaning."
    ],
    cautions: "Lean beside the spine, not on it. Keep pressure gentle over the lower back."
  },
  {
    id: "thumbing", side: "east", tradition: "Shiatsu · Japan", name: "Thumbing the Back Lines",
    areas: "Either side of the spine", pressure: 3, oil: false, mins: "3–4 min",
    summary: "Slow thumb pressure down the two muscular lines flanking the spine — in shiatsu, the bladder meridian, said to influence the whole body. Press–hold–release, point by point.",
    steps: [
      "Find the ropes of muscle running either side of the spine, about two finger-widths out from the bumps.",
      "Place your thumb pads on these lines at the top of the back, one thumb each side, fingers resting flat for support.",
      "Lean in slowly to a comfortable firmness, hold for 3–5 seconds, release slowly.",
      "Move down one thumb-width and repeat, walking all the way down to the sacrum.",
      "Do two or three slow passes, then soothe with a few palm strokes."
    ],
    tips: [
      "Press with straight thumbs backed by your body weight, not thumb-muscle effort.",
      "Points that feel tender to your partner often deserve one extra breath of gentle holding.",
      "The pace should feel meditative — around 5 seconds per point."
    ],
    cautions: "Two finger-widths off the spine — never on the vertebrae. Lighten up over the lower back."
  },
  {
    id: "acupressure", side: "east", tradition: "Acupressure · China", name: "Three Classic Points",
    areas: "Base of skull · Shoulder well · Hand", pressure: 3, oil: false, mins: "3–4 min",
    summary: "Three famous acupressure points for tension: Gates of Consciousness (base of skull), Shoulder Well (top of shoulders), and Union Valley (hand). Steady holds of 30–60 seconds each.",
    steps: [
      "GATES (GB20): find the hollows under the skull base, either side of the neck muscles. Curl your fingertips in, tilt their head slightly back into your fingers, hold 30–60 s.",
      "SHOULDER WELL (GB21): the highest point of the shoulder muscle, halfway between neck and shoulder tip. Squeeze or press down gently, hold 30 s each side.",
      "UNION VALLEY (LI4): the fleshy webbing between thumb and index finger. Squeeze between your thumb and finger to a dull ache, hold 30–60 s, then the other hand.",
      "Close by cradling the head or holding both shoulders still for a few breaths."
    ],
    tips: [
      "The right depth is a pleasant dull ache — never sharp.",
      "These pair beautifully with slow breathing: hold the point through 4–6 of their breaths.",
      "GB20 is a favorite for tension headaches and screen-neck."
    ],
    cautions: "Tradition and midwives agree: skip Shoulder Well (GB21) and Union Valley (LI4) during pregnancy. Never press the front or sides of the throat."
  },
  {
    id: "thai-palm", side: "east", tradition: "Thai massage · Thailand", name: "Thai Palm Presses",
    areas: "Legs · Back · Feet", pressure: 3, oil: false, mins: "4–6 min",
    summary: "Rhythmic alternating palm presses along the body's energy lines (sen), done on a floor mat in comfy clothes. Thai massage is sometimes called “lazy yoga” — this is its walking bassline.",
    steps: [
      "Partner lies face down on a mat, arms relaxed at their sides.",
      "Kneel at their feet. Press one palm into a calf, then the other palm a hand-width up, shifting your weight side to side like a slow cat-walk.",
      "Walk your palms up one leg, across the glutes and back (beside the spine), then down the other leg.",
      "Keep a steady rocking rhythm — press on their exhale where you can.",
      "Repeat the full circuit 2–3 times, slightly deeper each round."
    ],
    tips: [
      "The rocking of your own body creates the rhythm — let your weight do the work.",
      "Avoid pressing the back of the knee; hop your hand past it.",
      "A folded blanket under their ankles makes face-down lying much comfier."
    ],

    `<button class="${tab === id ? "on" : ""}" onclick="setTab('${id}')"><span class="ic">${ic}</span>${label}</button>`
  ).join("");
  $("#tabs").style.display = (view.name === "run") ? "none" : "flex";
}
function setTab(t) { tab = t; go({ name: t }); }

/* ---------- Runner ---------- */

let wakeLock = null;
async function grabWakeLock() {
  try { wakeLock = await navigator.wakeLock.request("screen"); } catch (e) { wakeLock = null; }
}
function releaseWakeLock() { try { wakeLock && wakeLock.release(); } catch (e) {} wakeLock = null; }

function chime() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [523.25, 659.25].forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = f; o.type = "sine";
      o.connect(g); g.connect(ctx.destination);
      const t0 = ctx.currentTime + i * 0.18;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.12, t0 + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.8);
      o.start(t0); o.stop(t0 + 0.9);
    });
  } catch (e) {}
}

function startRun(id) {
  const r = ROUTINES.find(x => x.id === id);
  run = { routine: r, idx: 0, remaining: r.steps[0].s, paused: false, timer: setInterval(tick, 1000) };
  grabWakeLock();
  go({ name: "run" });
}
function tick() {
  if (!run || run.paused) return;
  run.remaining--;
  if (run.remaining <= 0) {
    chime();
    if (run.idx + 1 < run.routine.steps.length) {
      run.idx++; run.remaining = run.routine.steps[run.idx].s;
    } else { finishRun(); return; }
  }
  if (view.name === "run") updateRunDom();
}
function updateRunDom() {
  const el = $("#clock"); if (!el) { render(); return; }
  el.textContent = fmt(Math.max(0, run.remaining));
  const step = run.routine.steps[run.idx];
  const pct = 100 * (1 - run.remaining / step.s);
  const bar = $("#runbarfill"); if (bar) bar.style.width = pct + "%";
  const no = $("#stepno"); if (no) no.textContent = `Step ${run.idx + 1} of ${run.routine.steps.length}`;
  const ti = $("#steptitle"); if (ti) ti.textContent = step.t;
  const cu = $("#stepcue"); if (cu) cu.textContent = step.cue;
}
function runView() {
  const step = run.routine.steps[run.idx];
  const pct = 100 * (1 - run.remaining / step.s);
  return `
  <div class="runner">
    <div class="stepno" id="stepno">Step ${run.idx + 1} of ${run.routine.steps.length}</div>
    <h2 id="steptitle">${esc(step.t)}</h2>
    <p class="cue" id="stepcue">${esc(step.cue)}</p>
    <div class="clock ${run.paused ? "paused" : ""}" id="clock">${fmt(run.remaining)}</div>
    <div class="runbar"><i id="runbarfill" style="width:${pct}%"></i></div>
    <div class="runctl">
      <button class="btn subtle" onclick="prevStep()">‹ Back</button>
      <button class="btn primary" onclick="togglePause()">${run.paused ? "Resume" : "Pause"}</button>
      <button class="btn subtle" onclick="nextStep()">Skip ›</button>
    </div>
    <div style="max-width:420px; margin:12px auto 0;">
      <button class="btn ghost" onclick="endEarly()">End session</button>
    </div>
  </div>`;
}
function togglePause() { run.paused = !run.paused; render(); }
function nextStep() {
  if (run.idx + 1 < run.routine.steps.length) { run.idx++; run.remaining = run.routine.steps[run.idx].s; render(); }
  else finishRun();
}
function prevStep() {
  if (run.idx > 0) { run.idx--; }
  run.remaining = run.routine.steps[run.idx].s; render();
}
function endEarly() { finishRun(); }
function finishRun() {
  clearInterval(run.timer);
  releaseWakeLock();
  chime();
  const r = run.routine;
  // count techniques practiced in this routine
  const ids = [...new Set(r.steps.map(s => s.tech).filter(Boolean))];
  ids.forEach(id => { db.practiced[id] = (db.practiced[id] || 0) + 1; });
  save();
  fdata = { routineId: r.id, routineName: r.name, minutes: r.minutes, pressure: "", rating: 0, notes: "" };
  run = null;
  go({ name: "feedback" });
}

/* ---------- Feedback after a session ---------- */

function feedbackView() {
  return `
  <header class="appbar">
    <h1>How was it?</h1>
    <p>${esc(fdata.routineName)} — capture your partner's feedback while it's fresh. This is how you get better.</p>
  </header>
  <label class="fieldlabel">Pressure, according to your partner</label>
  <div class="seg">
    ${["Too light", "Just right", "Too firm"].map(p =>
      `<button class="${fdata.pressure === p ? "on" : ""}" onclick="stashFeedback();fdata.pressure='${p}';render()">${p}</button>`).join("")}
  </div>
  <label class="fieldlabel">Partner's rating</label>
  <div class="hearts">
    ${[1, 2, 3, 4, 5].map(n => `<button class="${fdata.rating >= n ? "on" : ""}" onclick="stashFeedback();fdata.rating=${n};render()">♥</button>`).join("")}
  </div>
  <label class="fieldlabel">One thing to do more of · one thing to change</label>
  <textarea id="fb-notes" rows="4" placeholder="e.g. More scalp time. Slow down the kneading. Loved the forearm glides.">${esc(fdata.notes)}</textarea>
  <div style="margin-top:18px;">
    <button class="btn east" onclick="saveFeedback()">Save session</button>
    <button class="btn ghost" onclick="setTab('routines')">Discard</button>
  </div>`;
}
function stashFeedback() {
  fdata.notes = $("#fb-notes") ? $("#fb-notes").value : fdata.notes;
}
function saveFeedback() {
  stashFeedback();
  const notes = (fdata.notes || "").trim();
  db.sessions.unshift({
    date: new Date().toISOString(), routineId: fdata.routineId, name: fdata.routineName,
    minutes: fdata.minutes, pressure: fdata.pressure, rating: fdata.rating, notes
  });
  save();
  setTab("log");
}

/* ---------- Log ---------- */

function logView() {
  const total = db.sessions.length;
  const mins = db.sessions.reduce((a, s) => a + (s.minutes || 0), 0);
  const tried = Object.keys(db.practiced).filter(k => db.practiced[k] > 0).length;
  const top = Object.entries(db.practiced).filter(([, n]) => n > 0).sort((a, b) => b[1] - a[1]).slice(0, 5);
  return `
  <header class="appbar">
    <h1>Practice log</h1>
    <p>Your training data: every session, every piece of feedback.</p>
  </header>
  <div class="statrow">
    <div class="stat"><b>${total}</b><span>sessions</span></div>
    <div class="stat"><b>${mins}</b><span>minutes</span></div>
    <div class="stat"><b>${tried}<i style="font-style:normal; color:var(--muted); font-size:14px;">/${TECHNIQUES.length}</i></b><span>techniques</span></div>
  </div>
  <button class="btn subtle" onclick="openLogForm()">＋ Log a session manually</button>
  ${top.length ? `<div class="section-title">Most practiced</div><div class="card">${top.map(([id, n]) =>
    `<div class="kv"><span>${esc(tech(id) ? tech(id).name : id)}</span><b>×${n}</b></div>`).join("")}</div>` : ""}
  <div class="section-title">Sessions</div>
  ${total === 0 ? `
    <div class="empty">
      <div class="big">🌙</div>
      <h3>Nothing logged yet</h3>
      <p>Run a guided routine or log a freestyle session — feedback in, improvement out.</p>
    </div>` :
    db.sessions.map((s, i) => `
    <div class="card logcard">
      <div style="display:flex; justify-content:space-between; align-items:baseline; gap:8px;">
        <b style="font-size:15.5px;">${esc(s.name)}</b>
        <button style="border:none; background:transparent; color:var(--muted); cursor:pointer; font-size:15px;" onclick="delSession(${i})" aria-label="Delete">✕</button>
      </div>
      <div class="meta">${new Date(s.date).toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" })} · ${s.minutes} min${s.pressure ? " · " + esc(s.pressure) : ""}${s.rating ? " · " + '<span style="color:var(--east)">' + "♥".repeat(s.rating) + "</span>" : ""}</div>
      ${s.notes ? `<div class="notes">“${esc(s.notes)}”</div>` : ""}
    </div>`).join("")}`;
}
function delSession(i) {
  if (!confirm("Delete this session from the log?")) return;
  db.sessions.splice(i, 1); save(); render();
}
function openLogForm() {
  fdata = { name: "", minutes: 20, pressure: "", rating: 0, notes: "" };
  go({ name: "logform" });
}
function logFormView() {
  return `
  <button class="back" onclick="setTab('log')">‹ Log</button>
  <header class="appbar"><h1>Log a session</h1><p>Freestyled something off-menu? It still counts.</p></header>
  <label class="fieldlabel">What did you do?</label>
  <input type="text" id="lf-name" placeholder="e.g. Back + feet freestyle" value="${esc(fdata.name)}" />
  <label class="fieldlabel">Minutes</label>
  <input type="number" id="lf-mins" min="1" max="180" value="${fdata.minutes}" />
  <label class="fieldlabel">Pressure, according to your partner</label>
  <div class="seg">
    ${["Too light", "Just right", "Too firm"].map(p =>
      `<button class="${fdata.pressure === p ? "on" : ""}" onclick="stashLogForm();fdata.pressure='${p}';render()">${p}</button>`).join("")}
  </div>
  <label class="fieldlabel">Partner's rating</label>
  <div class="hearts">
    ${[1, 2, 3, 4, 5].map(n => `<button class="${fdata.rating >= n ? "on" : ""}" onclick="stashLogForm();fdata.rating=${n};render()">♥</button>`).join("")}
  </div>
  <label class="fieldlabel">Notes & feedback</label>
  <textarea id="lf-notes" rows="4" placeholder="What worked, what to change next time…">${esc(fdata.notes)}</textarea>
  <div style="margin-top:18px;">
    <button class="btn east" onclick="saveManualLog()">Save session</button>
  </div>`;
}
function stashLogForm() {
  fdata.name = $("#lf-name") ? $("#lf-name").value : fdata.name;
  fdata.minutes = $("#lf-mins") ? parseInt($("#lf-mins").value, 10) || fdata.minutes : fdata.minutes;
  fdata.notes = $("#lf-notes") ? $("#lf-notes").value : fdata.notes;
}
function saveManualLog() {
  stashLogForm();
  db.sessions.unshift({
    date: new Date().toISOString(), routineId: null, name: fdata.name.trim() || "Freestyle session",
    minutes: Math.max(1, fdata.minutes || 20), pressure: fdata.pressure, rating: fdata.rating, notes: fdata.notes.trim()
  });
  save();
  setTab("log");
}
