/* ————————————————— State ————————————————— */
const store = {
  get done() { try { return JSON.parse(localStorage.getItem("scf.done") || "[]"); } catch { return []; } },
  set done(v) { localStorage.setItem("scf.done", JSON.stringify(v)); },
  get entries() { try { return JSON.parse(localStorage.getItem("scf.entries") || "[]"); } catch { return []; } },
  set entries(v) { localStorage.setItem("scf.entries", JSON.stringify(v)); },
};

let state = { tab: "learn", moduleId: null, lessonId: null };
const $app = document.getElementById("app");
const $nav = document.getElementById("nav");
const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

function setState(patch) { state = { ...state, ...patch }; render(); window.scrollTo(0, 0); }

function toggleDone(id) {
  const d = store.done;
  store.done = d.includes(id) ? d.filter((x) => x !== id) : [...d, id];
  render();
}

/* ————————————————— Views ————————————————— */
function header() {
  return `<div class="brand"><h1>First</h1><span class="dot">·</span></div>
    <div class="tagline">A study in generous lovemaking — inspired by the principles of <em>She Comes First</em>.</div>`;
}

function viewLearn() {
  const done = store.done;
  if (state.lessonId) {
    const mod = MODULES.find((m) => m.id === state.moduleId);
    const lesson = mod.lessons.find((l) => l.id === state.lessonId);
    const isDone = done.includes(lesson.id);
    return `<div class="fade-in">
      <button class="back-btn" onclick="setState({lessonId:null})">‹ ${esc(mod.title)}</button>
      <div class="lesson-module">Module ${mod.number} · ${esc(mod.subtitle)}</div>
      <h2 class="lesson-title">${esc(lesson.title)}</h2>
      <div class="lesson-body">${lesson.body.map((p) => `<p>${esc(p)}</p>`).join("")}</div>
      <div class="practice"><div class="label">Try this</div><p>${esc(lesson.practice)}</p></div>
      <button class="complete-btn ${isDone ? "is-done" : ""}" onclick="toggleDone('${lesson.id}')">
        ${isDone ? "✓ Completed — tap to undo" : "Mark as complete"}
      </button>
    </div>`;
  }
  if (state.moduleId) {
    const mod = MODULES.find((m) => m.id === state.moduleId);
    return `<div class="fade-in">
      <button class="back-btn" onclick="setState({moduleId:null})">‹ All modules</button>
      <div class="lesson-module">Module ${mod.number}</div>
      <h2 class="lesson-title">${esc(mod.title)}</h2>
      <div class="sub" style="color:var(--muted);margin-bottom:16px">${esc(mod.subtitle)}</div>
      <div class="card" style="padding:6px 16px">
        ${mod.lessons.map((l) => {
          const isDone = done.includes(l.id);
          return `<button class="lesson-row ${isDone ? "is-done" : ""}" onclick="setState({lessonId:'${l.id}'})">
            <span class="check">${isDone ? "✓" : ""}</span><span class="t">${esc(l.title)}</span><span class="arrow">›</span>
          </button>`;
        }).join("")}
      </div>
    </div>`;
  }
  return `<div class="fade-in">${header()}
    ${MODULES.map((m) => {
      const total = m.lessons.length;
      const n = m.lessons.filter((l) => done.includes(l.id)).length;
      return `<button class="card" onclick="setState({moduleId:'${m.id}'})">
        <div class="kicker">Module ${m.number}</div>
        <h2>${esc(m.title)}</h2>
        <div class="sub">${esc(m.subtitle)}</div>
        <div class="meta">${n === total ? `<span class="done-chip">✓ Complete</span>` : `${n} of ${total} lessons`}</div>
      </button>`;
    }).join("")}
  </div>`;
}

function viewGuide() {
  return `<div class="fade-in">${header()}
    <h2 class="section-h" style="margin-top:6px">The ten principles</h2>
    ${PRINCIPLES.map((p, i) => `<div class="principle"><div class="num">${i + 1}</div>
      <div><h3>${esc(p.t)}</h3><p>${esc(p.d)}</p></div></div>`).join("")}
    <h2 class="section-h">Session flow</h2>
    <div class="card" style="padding:8px 18px">
      ${FLOW.map((f, i) => `<div class="flow-step"><div class="fnum">${i + 1}</div>
        <div><div class="ft">${esc(f.t)}</div><div class="fd">${esc(f.d)}</div></div></div>`).join("")}
    </div>
  </div>`;
}

function viewReflect() {
  const prompt = PROMPTS[new Date().getDate() % PROMPTS.length];
  const entries = store.entries;
  return `<div class="fade-in">${header()}
    <div class="prompt-card"><div class="p-label">Today's reflection</div><div class="p-text">${esc(prompt)}</div></div>
    <textarea id="entry-input" placeholder="Write privately — what did you notice, learn, or want to try?"></textarea>
    <button class="save-btn" onclick="saveEntry()">Save reflection</button>
    <p class="privacy-note" style="margin-top:14px">Everything you write stays on this device only. Nothing is uploaded anywhere.</p>
    ${entries.length ? `<h2 class="section-h">Past reflections</h2>` : ""}
    ${entries.map((e, i) => `<div class="entry"><div class="e-date">${esc(e.date)}</div>
      <div class="e-text">${esc(e.text)}</div>
      <button class="e-del" onclick="deleteEntry(${i})">Delete</button></div>`).join("")}
  </div>`;
}

function saveEntry() {
  const el = document.getElementById("entry-input");
  const text = el.value.trim();
  if (!text) return;
  const date = new Date().toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
  store.entries = [{ date, text }, ...store.entries];
  render();
}
function deleteEntry(i) {
  const e = store.entries; e.splice(i, 1); store.entries = e; render();
}

function viewProgress() {
  const done = store.done;
  const total = MODULES.reduce((s, m) => s + m.lessons.length, 0);
  const n = MODULES.reduce((s, m) => s + m.lessons.filter((l) => done.includes(l.id)).length, 0);
  const pct = total ? Math.round((n / total) * 100) : 0;
  return `<div class="fade-in">${header()}
    <div class="stat-row">
      <div class="stat"><div class="v">${n}</div><div class="l">Lessons done</div></div>
      <div class="stat"><div class="v">${pct}%</div><div class="l">Complete</div></div>
      <div class="stat"><div class="v">${store.entries.length}</div><div class="l">Reflections</div></div>
    </div>
    <h2 class="section-h">By module</h2>
    ${MODULES.map((m) => {
      const mt = m.lessons.length;
      const mn = m.lessons.filter((l) => done.includes(l.id)).length;
      return `<div class="module-progress">
        <div class="mp-head"><span>${m.number} · ${esc(m.title)}</span><span class="n">${mn}/${mt}</span></div>
        <div class="bar-wrap"><div class="bar" style="width:${mt ? (mn / mt) * 100 : 0}%"></div></div>
      </div>`;
    }).join("")}
    <div class="card" style="margin-top:20px">
      <div class="kicker">Remember</div>
      <p style="font-size:15px;color:var(--muted)">Progress here means nothing unless it shows up as patience, attention, and generosity with her. The lessons are the map — she is the territory.</p>
    </div>
  </div>`;
}

/* ————————————————— Render ————————————————— */

function render() {
  const views = { learn: viewLearn, guide: viewGuide, reflect: viewReflect, progress: viewProgress };
  $app.innerHTML = views[state.tab]();
  $nav.innerHTML = TABS.map((t) => `<button class="${state.tab === t.id ? "active" : ""}"
    onclick="setState({tab:'${t.id}',moduleId:null,lessonId:null})">
    <span class="ico">${t.ico}</span>${t.label}</button>`).join("");
}
render();

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
