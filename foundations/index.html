<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<title>Foundations</title>
<meta name="description" content="Learn the main teachings of Christianity — lessons, quizzes, and the great texts of the faith." />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Foundations" />
<meta name="theme-color" content="#f7f2e8" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon-180.png" />
<link rel="icon" type="image/png" href="icon-180.png" />
<style>
  :root {
    --bg: #f7f2e8;
    --surface: #fffdf8;
    --surface-2: #f1e9d8;
    --line: #e3d9c2;
    --ink: #2b2417;
    --muted: #8a7d63;
    --indigo: #253258;
    --indigo-soft: #3c4a77;
    --gold: #b8862e;
    --gold-soft: #d9aa4f;
    --garnet: #8a3232;
    --good: #4a7d55;
    --serif: ui-serif, "New York", Georgia, "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.6;
    overscroll-behavior-y: none;
    -webkit-font-smoothing: antialiased;
  }
  #app {
    max-width: 640px;
    margin: 0 auto;
    padding: calc(env(safe-area-inset-top) + 18px) 20px calc(env(safe-area-inset-bottom) + 92px);
    min-height: 100%;
  }
  header.appbar { margin-bottom: 18px; }
  .appbar h1 {
    font-family: var(--serif);
    font-size: 28px;
    color: var(--indigo);
    letter-spacing: 0.2px;
  }
  .appbar p { color: var(--muted); font-size: 14px; margin-top: 2px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px 18px;
    margin-bottom: 12px;
    box-shadow: 0 1px 2px rgba(43, 36, 23, 0.05);
  }
  .card.tappable { cursor: pointer; }
  .card.tappable:active { background: var(--surface-2); }

  .module-tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 4px;
  }
  .module-head h2 { font-family: var(--serif); font-size: 21px; color: var(--indigo); line-height: 1.3; }
  .module-head p { color: var(--muted); font-size: 14px; margin-top: 4px; }

  .lesson-row {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 2px;
    border-top: 1px solid var(--line);
    cursor: pointer;
  }
  .lesson-row:active { opacity: 0.7; }
  .lesson-row .dot {
    width: 26px; height: 26px; border-radius: 50%;
    border: 2px solid var(--line);
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; color: #fff;
  }
  .lesson-row.done .dot { background: var(--good); border-color: var(--good); }
  .lesson-row .t { font-size: 15.5px; font-weight: 500; }
  .lesson-row .chev { margin-left: auto; color: var(--muted); font-size: 18px; }

  /* Lesson view */
  .backlink {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--indigo-soft); font-weight: 600; font-size: 15px;
    background: none; border: none; font-family: var(--sans);
    cursor: pointer; margin-bottom: 14px; padding: 4px 0;
  }
  .lesson-view h2 { font-family: var(--serif); font-size: 26px; color: var(--indigo); line-height: 1.25; margin-bottom: 4px; }
  .lesson-view .kicker { color: var(--gold); font-size: 12px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; }
  .keyidea {
    background: var(--surface-2);
    border-left: 4px solid var(--gold-soft);
    border-radius: 0 12px 12px 0;
    padding: 12px 16px;
    margin: 16px 0;
    font-size: 15.5px;
    font-weight: 500;
  }
  .lesson-view .body p { margin-bottom: 14px; font-size: 16px; }
  .verse {
    background: var(--indigo);
    color: #f3ecdd;
    border-radius: 14px;
    padding: 18px 20px;
    margin: 18px 0;
  }
  .verse .vtext { font-family: var(--serif); font-size: 17px; line-height: 1.55; font-style: italic; }
  .verse .vref { margin-top: 10px; font-size: 13px; color: var(--gold-soft); font-weight: 600; letter-spacing: 0.5px; }
  .terms { margin: 18px 0; }
  .terms h3, .body h3 { font-size: 13px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .terms dl div { padding: 10px 0; border-top: 1px solid var(--line); }
  .terms dt { font-weight: 700; font-size: 15px; color: var(--indigo); }
  .terms dd { font-size: 14.5px; color: var(--ink); margin-top: 2px; }

  .btn {
    display: block; width: 100%;
    border: none; border-radius: 14px;
    padding: 15px;
    font-size: 16px; font-weight: 700;
    font-family: var(--sans);
    cursor: pointer;
    margin-top: 8px;
  }
  .btn.primary { background: var(--indigo); color: #fff; }
  .btn.primary:active { background: var(--indigo-soft); }
  .btn.done { background: var(--good); color: #fff; }
  .btn.ghost { background: var(--surface-2); color: var(--indigo); border: 1px solid var(--line); }

  /* Quiz */
  .quiz-q { font-family: var(--serif); font-size: 20px; color: var(--indigo); line-height: 1.4; margin: 10px 0 16px; }
  .opt {
    display: block; width: 100%; text-align: left;
    background: var(--surface); border: 1.5px solid var(--line);
    border-radius: 13px; padding: 13px 15px;
    font-size: 15.5px; font-family: var(--sans); color: var(--ink);
    margin-bottom: 10px; cursor: pointer; line-height: 1.45;
  }
  .opt:active { background: var(--surface-2); }
  .opt.correct { border-color: var(--good); background: #edf4ee; font-weight: 600; }
  .opt.wrong { border-color: var(--garnet); background: #f7ecec; }
  .why {
    background: var(--surface-2); border-radius: 12px;
    padding: 12px 15px; font-size: 14.5px; margin: 4px 0 12px;
    color: var(--ink);
  }
  .quiz-meta { color: var(--muted); font-size: 13.5px; font-weight: 600; letter-spacing: 0.4px; }
  .score-big { font-family: var(--serif); font-size: 44px; color: var(--indigo); text-align: center; margin: 10px 0 2px; }
  .score-sub { text-align: center; color: var(--muted); margin-bottom: 16px; }

  /* Texts */
  .text-card h3 { font-family: var(--serif); font-size: 19px; color: var(--indigo); }
  .text-card .sub { color: var(--muted); font-size: 13.5px; margin-top: 2px; }
  .text-body { display: none; margin-top: 12px; border-top: 1px solid var(--line); padding-top: 12px; }
  .text-card.open .text-body { display: block; }
  .text-body p { font-family: var(--serif); font-size: 16px; margin-bottom: 10px; white-space: pre-line; }
  .text-body .note { font-family: var(--sans); font-size: 13.5px; color: var(--muted); font-style: normal; }
  .text-body ol { padding-left: 22px; font-family: var(--serif); font-size: 16px; }
  .text-body ol li { margin-bottom: 6px; }

  /* Progress */
  .bar { height: 10px; background: var(--surface-2); border-radius: 6px; overflow: hidden; margin-top: 8px; }
  .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold-soft), var(--gold)); border-radius: 6px; }
  .prog-row { margin-bottom: 4px; }
  .prog-row .lbl { display: flex; justify-content: space-between; font-size: 14.5px; font-weight: 600; }
  .prog-row .lbl span:last-child { color: var(--muted); font-weight: 500; }

  /* Tab bar */
  nav.tabs {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: rgba(255, 253, 248, 0.94);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid var(--line);
    display: flex;
    padding: 8px 8px calc(env(safe-area-inset-bottom) + 8px);
    z-index: 10;
  }
  nav.tabs button {
    flex: 1; background: none; border: none;
    font-family: var(--sans); font-size: 11px; font-weight: 600;
    color: var(--muted); cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 4px 0;
  }
  nav.tabs button .ic { font-size: 21px; line-height: 1; }
  nav.tabs button.active { color: var(--indigo); }

  .empty { text-align: center; color: var(--muted); padding: 30px 10px; font-size: 15px; }
  .footnote { color: var(--muted); font-size: 12.5px; text-align: center; margin-top: 18px; padding: 0 10px; }
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabs" id="tabs"></nav>

<script>
"use strict";

/* ============================== CONTENT ============================== */

const MODULES = [
  {
    tag: "Module 1",
    title: "God and the Story of the World",
    tagline: "Who God is, and how the Bible's story begins.",
    lessons: [
      {
        t: "Who Is God?",
        key: "Christianity teaches that there is one God — the eternal Creator of everything — who is personal, holy, loving, and just.",
        body: [
          "At the heart of Christianity is not first a set of rules but a person: God. Christians believe in one God (this is called monotheism), who did not begin and will not end, who made everything that exists, and who keeps it all in being moment by moment.",
          "The Bible describes God's character with a handful of great words. He is holy — utterly pure and set apart from all evil. He is love — not merely loving, but love itself (1 John 4:8). He is just — he cares about right and wrong and will set all things right. And he is faithful — he keeps his promises across centuries.",
          "Crucially, God is personal. He speaks, hears, and desires a relationship with human beings. Christianity is, from first to last, the story of God seeking people."
        ],
        verse: { text: "Hear, O Israel: the Lord our God, the Lord is one. You shall love the Lord your God with all your heart, with all your soul, and with all your might.", ref: "Deuteronomy 6:4–5" },
        terms: [
          ["Monotheism", "Belief in one God, in contrast to many gods (polytheism)."],
          ["Holy", "Set apart, morally perfect; the word the Bible uses most insistently about God."],
          ["Providence", "God's ongoing care for and governance of everything he has made."]
        ]
      },
      {
        t: "The Trinity",
        key: "The one God exists eternally as three persons — Father, Son, and Holy Spirit — one in being, distinct in person.",
        body: [
          "The Trinity is Christianity's most distinctive teaching about God. Christians do not believe in three gods, and they do not believe God merely wears three masks. They believe the one God has always existed as three persons — the Father, the Son (Jesus Christ), and the Holy Spirit — fully equal, fully God, in perfect eternal relationship.",
          "This is why Christians can say \"God is love\" of eternity itself: before anything was created, the Father, Son, and Spirit loved one another. Love is not something God started doing; it is who God is.",
          "The word \"Trinity\" is not in the Bible, but the pattern is everywhere: Jesus is baptized while the Father speaks and the Spirit descends (Matthew 3), and his followers are sent to baptize \"in the name of the Father and of the Son and of the Holy Spirit\" (Matthew 28:19). The teaching was carefully defined in the early church creeds. It remains a mystery — not a puzzle to solve, but a reality bigger than our categories."
        ],
        verse: { text: "Go therefore and make disciples of all nations, baptizing them in the name of the Father and of the Son and of the Holy Spirit.", ref: "Matthew 28:19" },
        terms: [
          ["Trinity", "One God in three persons: Father, Son, and Holy Spirit."],
          ["Person (in the Trinity)", "A distinct \"who\" within the one divine \"what\" — the Father is not the Son, yet each is fully God."],
          ["Creed", "A short, authoritative summary of Christian belief, e.g. the Apostles' Creed or Nicene Creed."]
        ]
      },
      {
        t: "Creation and the Image of God",
        key: "God made the world good, and made every human being in his own image — giving each person immeasurable dignity.",
        body: [
          "The Bible opens with God creating the heavens and the earth and repeatedly calling what he made \"good.\" Creation is not an accident or an illusion; it is a gift. Matter, bodies, work, food, rest, and beauty all matter to God.",
          "The climax of the creation account is humanity: \"God created man in his own image... male and female he created them\" (Genesis 1:27). To be made in God's image means humans are like God in ways nothing else in creation is — able to love, reason, create, choose, and know God — and are appointed to care for the world as his representatives.",
          "This single teaching grounds Christian ethics: every human life, from the powerful to the powerless, carries the image of God and therefore has dignity that no one may erase."
        ],
        verse: { text: "God created man in his own image. In God's image he created him; male and female he created them.", ref: "Genesis 1:27" },
        terms: [
          ["Image of God (Imago Dei)", "The unique likeness to God given to every human being, the basis of human dignity."],
          ["Creation", "The teaching that everything that exists was freely made by God and declared good."],
          ["Stewardship", "Humanity's calling to care for the created world on God's behalf."]
        ]
      },
      {
        t: "The Fall and Sin",
        key: "Humanity turned away from God — an event called the Fall — and sin now runs through every human heart, fracturing our relationship with God, each other, and creation.",
        body: [
          "If the world was made good, why is it so broken? The Bible's answer is the Fall: the first humans, given real freedom, chose to distrust and disobey God (Genesis 3). Sin entered the world — and with it shame, blame, violence, and death.",
          "Sin, in Christian teaching, is more than breaking rules. It is a broken relationship — putting ourselves in God's place, loving the wrong things or loving good things in the wrong order. Jesus taught that sin begins in the heart before it ever reaches the hands (Matthew 5).",
          "Christianity is honest about this diagnosis because it is hopeful about the cure. The rest of the Bible's story is God's rescue mission: he does not abandon his fallen world, he sets out to redeem it. That plan runs through Israel, the covenants, and the prophets — and comes to its center in Jesus."
        ],
        verse: { text: "For all have sinned, and fall short of the glory of God.", ref: "Romans 3:23" },
        terms: [
          ["The Fall", "Humanity's original turn away from God, described in Genesis 3."],
          ["Sin", "Rebellion against God — in desires, thoughts, words, and deeds — that separates us from him."],
          ["Covenant", "A solemn, binding relationship God establishes with people, e.g. with Abraham, Israel, and finally through Christ."]
        ]
      }
    ]
  },
  {
    tag: "Module 2",
    title: "Jesus Christ",
    tagline: "The center of the faith: his identity, teaching, death, and resurrection.",
    lessons: [
      {
        t: "Who Is Jesus?",
        key: "Jesus of Nazareth is God the Son become human — fully God and fully man — the promised Messiah.",
        body: [
          "Christianity stands or falls on one question: who is Jesus? The Christian answer is staggering — the eternal Son of God became a human being. This is called the Incarnation (\"becoming flesh\"). Born to Mary in Bethlehem around 4 BC, raised in Nazareth, Jesus is not half-God and half-man, but fully both.",
          "\"Christ\" is not Jesus' surname; it is a title — the Greek form of \"Messiah,\" meaning \"Anointed One.\" Israel had waited centuries for God's promised King. Christians confess that Jesus is that King, and more: Thomas falls before the risen Jesus and says, \"My Lord and my God\" (John 20:28).",
          "Because Jesus is God, he can truly reveal God — \"whoever has seen me has seen the Father\" (John 14:9). Because he is human, he can truly stand in for us. Everything else in Christian teaching hangs on this."
        ],
        verse: { text: "In the beginning was the Word, and the Word was with God, and the Word was God... The Word became flesh and lived among us.", ref: "John 1:1, 14" },
        terms: [
          ["Incarnation", "God the Son taking on full human nature in Jesus."],
          ["Messiah / Christ", "\"Anointed One\" — the promised deliverer and King of Israel."],
          ["Son of God", "A title expressing Jesus' unique, eternal relationship to the Father."]
        ]
      },
      {
        t: "The Kingdom of God: Jesus' Teaching",
        key: "Jesus announced that God's kingdom — God's rule of justice, mercy, and peace — was breaking into the world through him.",
        body: [
          "Jesus' central message was simple to say and endless to explore: \"The kingdom of God has come near; repent and believe the good news\" (Mark 1:15). The kingdom is not a place on a map but God's own reign — the world set right under God's rule.",
          "He taught mostly in parables — short, vivid stories like the Prodigal Son, the Good Samaritan, and the Mustard Seed — that turn our assumptions upside down: the last are first, the humble are lifted up, the lost are sought until found.",
          "His miracles — healing the sick, feeding crowds, calming storms — were not magic tricks but signs: previews of the kingdom, glimpses of a world without disease, hunger, or chaos. And his company scandalized the respectable: he ate with tax collectors and sinners, touched lepers, and welcomed children, showing that no one is beneath God's mercy."
        ],
        verse: { text: "The time is fulfilled, and the Kingdom of God is at hand! Repent, and believe in the Good News.", ref: "Mark 1:15" },
        terms: [
          ["Kingdom of God", "God's reign — begun in Jesus, growing now, to be completed when he returns."],
          ["Parable", "A short story from ordinary life that reveals a truth about God's kingdom."],

        ]
      },
      {
        t: "The Cross",
        key: "Jesus died on a Roman cross bearing the sin of the world — the ultimate act of God's love, reconciling humanity to God.",
        body: [
          "Every Gospel slows down dramatically when it reaches Jesus' final week. Betrayed by a friend, condemned in a rigged trial, Jesus was crucified outside Jerusalem around AD 30. Christians mark this day as Good Friday — \"good\" because of what his death accomplished.",
          "The New Testament describes the cross from many angles: a sacrifice that deals with sin once for all; a ransom that sets captives free; a substitution — \"Christ died for our sins\" (1 Corinthians 15:3), the innocent for the guilty; a victory over evil, sin, and death; and above all a demonstration of love: \"God shows his own love toward us, in that while we were yet sinners, Christ died for us\" (Romans 5:8).",
          "The teaching that Christ's death reconciles us to God is called the atonement — literally \"at-one-ment.\" On the cross, God himself, in the person of his Son, absorbed the cost of human sin so that forgiveness could be freely offered to everyone."
        ],
        verse: { text: "God shows his own love toward us, in that while we were yet sinners, Christ died for us.", ref: "Romans 5:8" },
        terms: [
          ["Atonement", "Christ's death dealing with sin and reconciling humanity to God."],
          ["Good Friday", "The day Christians remember the crucifixion."],
          ["Grace", "God's undeserved favor — love given as a gift, not a wage."]
        ]
      },
      {
        t: "The Resurrection",
        key: "On the third day God raised Jesus bodily from the dead — the event on which all of Christianity rests.",
        body: [
          "Christianity did not begin with a philosophy; it began with an empty tomb. On the Sunday after the crucifixion — celebrated ever since as Easter — Jesus' followers found his tomb empty and then met him alive: talking, eating, showing his scars. Paul lists hundreds of eyewitnesses (1 Corinthians 15).",
          "The resurrection is not a metaphor for spring or for hope in general. The apostles staked their lives on it as an event. Paul is blunt: \"If Christ has not been raised, your faith is futile\" (1 Corinthians 15:17). It is God's public verdict — vindicating everything Jesus said and did, and breaking the power of death itself.",
          "It is also a preview: what happened to Jesus' body is what God promises for his people and, ultimately, his world — not escape from creation but its renewal. That is why the first Christians met on Sunday, the day of resurrection, and why hope is the signature Christian mood."
        ],
        verse: { text: "He is not here, but is risen!", ref: "Luke 24:6" },
        terms: [
          ["Resurrection", "God raising Jesus bodily from death to unending life — not mere resuscitation."],
          ["Easter", "The celebration of the resurrection; the most important day of the Christian year."],
          ["Apostle", "One of those sent out as an authorized witness of the risen Jesus."]
        ]
      },
      {
        t: "Ascension and Return",
        key: "The risen Jesus reigns now as Lord, and Christians await his return, when he will judge the world and make all things new.",
        body: [

        verse: { text: "This Jesus, who was received up from you into the sky, will come back in the same way as you saw him going into the sky.", ref: "Acts 1:11" },

          ["Lord", "The earliest Christian confession — \"Jesus is Lord\" — claiming his authority over all of life."]

  {

          "This sets Christianity apart from every system of self-salvation. Religion says: perform, and you will be accepted. The gospel says: you are accepted because of Christ — now live from that acceptance, not for it. Good works matter enormously, but as the fruit of salvation, never its price."
        ],
        verse: { text: "For by grace you have been saved through faith, and that not of yourselves; it is the gift of God, not of works, that no one would boast.", ref: "Ephesians 2:8–9" },
        terms: [

      {

        ],
        verse: { text: "Believe in the Lord Jesus Christ, and you will be saved.", ref: "Acts 16:31" },
        terms: [

          ["Faith", "Personal trust in Christ — reliance, not mere opinion."],

      {

• Law (Genesis–Deuteronomy): creation, the Fall, Israel's founding story.

• Poetry & Wisdom (Job–Song of Songs): Psalms for prayer, Proverbs for life.
• Prophets (Isaiah–Malachi): calls to faithfulness, promises of the Messiah.

NEW TESTAMENT (27 books)
• Gospels (Matthew, Mark, Luke, John): the life, death, and resurrection of Jesus.
• Acts: the Spirit and the early church.
• Letters (Romans–Jude): teaching for the young churches.
• Revelation: the end of the story — all things made new.`,
    note: "Catholic and Orthodox Bibles include several additional Old Testament books (the deuterocanonical books)."
  }
];

/* ============================== STATE & APP ============================== */

const store = {
  read() {
    try { return JSON.parse(localStorage.getItem("foundations") || "{}"); }
    catch { return {}; }
  },
  write(s) { localStorage.setItem("foundations", JSON.stringify(s)); }
};

let state = store.read();
state.done = state.done || {};           // "m-l" -> true
state.bestScore = state.bestScore ?? null;
state.quizzesTaken = state.quizzesTaken || 0;

const app = document.getElementById("app");
const tabsEl = document.getElementById("tabs");
let tab = "learn";
let view = { screen: "modules" };        // learn navigation
let quiz = null;                          // active quiz state

const TABS = [
  { id: "learn", label: "Learn", ic: "📖" },
  { id: "quiz", label: "Quiz", ic: "✍️" },
  { id: "texts", label: "Texts", ic: "🕊️" },
  { id: "progress", label: "Progress", ic: "🌱" }
];

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function renderTabs() {
  tabsEl.innerHTML = TABS.map(t =>
    `<button class="${tab === t.id ? "active" : ""}" data-tab="${t.id}">
       <span class="ic">${t.ic}</span>${t.label}
     </button>`).join("");
}

tabsEl.addEventListener("click", e => {
  const b = e.target.closest("button[data-tab]");
  if (!b) return;
  tab = b.dataset.tab;
  if (tab === "learn") view = { screen: "modules" };
  render();
  window.scrollTo(0, 0);
});

/* ---------- Learn ---------- */

function lessonsDoneIn(mi) {
  return MODULES[mi].lessons.filter((_, li) => state.done[mi + "-" + li]).length;
}

function renderModules() {
  const totalDone = Object.keys(state.done).length;
  const total = MODULES.reduce((n, m) => n + m.lessons.length, 0);
  return `
    <header class="appbar">
      <h1>Foundations</h1>
      <p>The main teachings of Christianity · ${totalDone}/${total} lessons complete</p>
    </header>
    ${MODULES.map((m, mi) => `
      <div class="card">
        <div class="module-head">
          <span class="module-tag">${m.tag} · ${lessonsDoneIn(mi)}/${m.lessons.length}</span>
          <h2>${esc(m.title)}</h2>
          <p>${esc(m.tagline)}</p>
        </div>
        <div style="margin-top:10px">
          ${m.lessons.map((l, li) => `
            <div class="lesson-row ${state.done[mi + "-" + li] ? "done" : ""}" data-m="${mi}" data-l="${li}">
              <span class="dot">${state.done[mi + "-" + li] ? "✓" : ""}</span>
              <span class="t">${esc(l.t)}</span>
              <span class="chev">›</span>
            </div>`).join("")}
        </div>
      </div>`).join("")}
    <p class="footnote">Scripture quotations follow the World English Bible and traditional liturgical texts (public domain). Where major traditions differ, lessons say so.</p>`;
}

function renderLesson(mi, li) {
  const m = MODULES[mi], l = m.lessons[li];
  const done = !!state.done[mi + "-" + li];
  const nextLi = li + 1 < m.lessons.length ? li + 1 : null;
  const nextMi = nextLi === null && mi + 1 < MODULES.length ? mi + 1 : null;
  return `
    <div class="lesson-view">
      <button class="backlink" data-act="back">‹ All lessons</button>
      <span class="kicker">${m.tag} · Lesson ${li + 1} of ${m.lessons.length}</span>
      <h2>${esc(l.t)}</h2>
      <div class="keyidea">${esc(l.key)}</div>
      <div class="body">${l.body.map(p => `<p>${p}</p>`).join("")}</div>
      <div class="verse">
        <div class="vtext">“${esc(l.verse.text)}”</div>
        <div class="vref">${esc(l.verse.ref)}</div>
      </div>
      <div class="terms">
        <h3>Key terms</h3>
        <dl>${l.terms.map(([t, d]) => `<div><dt>${esc(t)}</dt><dd>${esc(d)}</dd></div>`).join("")}</dl>
      </div>
      <button class="btn ${done ? "done" : "primary"}" data-act="toggle-done" data-m="${mi}" data-l="${li}">
        ${done ? "✓ Completed — tap to unmark" : "Mark lesson complete"}
      </button>
      ${nextLi !== null
        ? `<button class="btn ghost" data-act="open" data-m="${mi}" data-l="${nextLi}">Next: ${esc(m.lessons[nextLi].t)} ›</button>`
        : nextMi !== null
          ? `<button class="btn ghost" data-act="open" data-m="${nextMi}" data-l="0">Next module: ${esc(MODULES[nextMi].title)} ›</button>`
          : `<button class="btn ghost" data-act="back">You've reached the end — see all lessons</button>`}
    </div>`;
}

/* ---------- Quiz ---------- */

function startQuiz() {
  const pool = [...QUESTIONS];
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  quiz = { qs: pool.slice(0, 10), i: 0, score: 0, picked: null };
}

function renderQuiz() {
  if (!quiz) {
    return `
      <header class="appbar"><h1>Quiz</h1><p>Check what you've learned</p></header>
      <div class="card">
        <p style="font-size:15.5px">Ten questions, drawn at random from all five modules. Each answer comes with a short explanation — wrong answers teach as much as right ones.</p>
        ${state.bestScore !== null ? `<p style="margin-top:10px;color:var(--muted);font-size:14px">Best score: <b style="color:var(--indigo)">${state.bestScore}/10</b> · Quizzes taken: ${state.quizzesTaken}</p>` : ""}
        <button class="btn primary" data-act="start-quiz">Start quiz</button>
      </div>`;
  }
  if (quiz.i >= quiz.qs.length) {
    const s = quiz.score;
    const msg = s >= 9 ? "Excellent — you know the foundations well."
      : s >= 7 ? "Strong work — a quick review will lock it in."
      : s >= 5 ? "Good start — revisit a lesson or two and try again."
      : "A perfect excuse to reread — every attempt teaches.";
    return `
      <header class="appbar"><h1>Quiz</h1><p>Results</p></header>
      <div class="card">
        <div class="score-big">${s}/10</div>
        <div class="score-sub">${msg}</div>
        <button class="btn primary" data-act="start-quiz">Try again</button>
        <button class="btn ghost" data-act="quit-quiz">Back to quiz home</button>
      </div>`;
  }
  const q = quiz.qs[quiz.i];
  const answered = quiz.picked !== null;
  return `
    <header class="appbar"><h1>Quiz</h1><p class="quiz-meta">Question ${quiz.i + 1} of ${quiz.qs.length} · Score ${quiz.score}</p></header>
    <div class="card">
      <div class="quiz-q">${esc(q.q)}</div>
      ${q.opts.map((o, oi) => {
        let cls = "opt";
        if (answered && oi === q.a) cls += " correct";
        else if (answered && oi === quiz.picked && oi !== q.a) cls += " wrong";
        return `<button class="${cls}" data-act="pick" data-o="${oi}" ${answered ? "disabled" : ""}>${esc(o)}</button>`;
      }).join("")}
      ${answered ? `<div class="why">${quiz.picked === q.a ? "✓ Correct. " : ""}${esc(q.why)}</div>
        <button class="btn primary" data-act="next-q">${quiz.i + 1 < quiz.qs.length ? "Next question" : "See results"}</button>` : ""}
    </div>`;
}

/* ---------- Texts ---------- */

let openText = null;

function renderTexts() {
  return `
    <header class="appbar"><h1>Texts</h1><p>The great texts of the faith — for reading and memorizing</p></header>
    ${TEXTS.map((t, ti) => `
      <div class="card text-card tappable ${openText === ti ? "open" : ""}" data-act="text" data-t="${ti}">
        <h3>${esc(t.title)}</h3>
        <div class="sub">${esc(t.sub)}</div>
        <div class="text-body">
          ${t.body ? `<p>${esc(t.body)}</p>` : ""}
          ${t.list ? `<ol>${t.list.map(x => `<li>${esc(x)}</li>`).join("")}</ol>` : ""}
          ${t.note ? `<p class="note">${esc(t.note)}</p>` : ""}
        </div>
      </div>`).join("")}`;
}

/* ---------- Progress ---------- */

function renderProgress() {
  const total = MODULES.reduce((n, m) => n + m.lessons.length, 0);
  const done = Object.keys(state.done).length;
  const pct = Math.round((done / total) * 100);
  return `
    <header class="appbar"><h1>Progress</h1><p>${done} of ${total} lessons · ${pct}% complete</p></header>
    <div class="card">
      ${MODULES.map((m, mi) => {
        const d = lessonsDoneIn(mi);
        return `<div class="prog-row">
          <div class="lbl"><span>${esc(m.title)}</span><span>${d}/${m.lessons.length}</span></div>
          <div class="bar"><i style="width:${(d / m.lessons.length) * 100}%"></i></div>
        </div>`;
      }).join("<div style='height:14px'></div>")}
    </div>
    <div class="card">
      <div class="lbl" style="display:flex;justify-content:space-between;font-weight:600;font-size:14.5px">
        <span>Best quiz score</span><span style="color:var(--indigo)">${state.bestScore === null ? "—" : state.bestScore + "/10"}</span>
      </div>
      <div class="lbl" style="display:flex;justify-content:space-between;font-weight:600;font-size:14.5px;margin-top:6px">
        <span>Quizzes taken</span><span style="color:var(--indigo)">${state.quizzesTaken}</span>
      </div>
    </div>
    <button class="btn ghost" data-act="reset">Reset all progress</button>
    <p class="footnote">All progress is stored only on this device.</p>`;
}

/* ---------- Render & events ---------- */

function render() {
  renderTabs();
  if (tab === "learn") {
    app.innerHTML = view.screen === "lesson" ? renderLesson(view.m, view.l) : renderModules();
  } else if (tab === "quiz") {
    app.innerHTML = renderQuiz();
  } else if (tab === "texts") {
    app.innerHTML = renderTexts();
  } else {
    app.innerHTML = renderProgress();
  }
}

app.addEventListener("click", e => {
  const row = e.target.closest(".lesson-row");
  if (row) {
    view = { screen: "lesson", m: +row.dataset.m, l: +row.dataset.l };
    render(); window.scrollTo(0, 0); return;
  }
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;

  if (act === "back") { view = { screen: "modules" }; render(); window.scrollTo(0, 0); }
  else if (act === "open") { view = { screen: "lesson", m: +el.dataset.m, l: +el.dataset.l }; render(); window.scrollTo(0, 0); }
  else if (act === "toggle-done") {
    const k = el.dataset.m + "-" + el.dataset.l;
    if (state.done[k]) delete state.done[k]; else state.done[k] = true;
    store.write(state); render();
  }
  else if (act === "start-quiz") { startQuiz(); render(); window.scrollTo(0, 0); }
  else if (act === "quit-quiz") { quiz = null; render(); }
  else if (act === "pick") {
    if (quiz.picked !== null) return;
    quiz.picked = +el.dataset.o;
    if (quiz.picked === quiz.qs[quiz.i].a) quiz.score++;
    render();
  }
  else if (act === "next-q") {
    quiz.i++; quiz.picked = null;
    if (quiz.i >= quiz.qs.length) {
      state.quizzesTaken++;
      if (state.bestScore === null || quiz.score > state.bestScore) state.bestScore = quiz.score;
      store.write(state);
    }
    render(); window.scrollTo(0, 0);
  }
  else if (act === "text") {
    const ti = +el.dataset.t;
    openText = openText === ti ? null : ti;
    render();
  }
  else if (act === "reset") {
    if (confirm("Reset all lesson progress and quiz scores?")) {
      state = { done: {}, bestScore: null, quizzesTaken: 0 };
      store.write(state); render();
    }
  }
});

render();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
