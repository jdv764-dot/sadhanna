name: Deploy app to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/she-comes-first-app-q3o95v
    paths:
      - "she-comes-first/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: she-comes-first

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
