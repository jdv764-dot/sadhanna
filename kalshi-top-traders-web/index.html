<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kalshi Top Traders</title>
<meta name="description" content="Active bets from the most profitable traders on Kalshi">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e1116">
<style>
  :root {
    --bg: #0e1116;
    --card: #171c24;
    --card2: #1e242e;
    --text: #e8ecf1;
    --muted: #8b96a5;
    --green: #17c37b;
    --red: #f0564f;
    --accent: #0bbd7a;
    --border: #262d38;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    min-height: 100%;
    padding-bottom: calc(70px + env(safe-area-inset-bottom));
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: rgba(14,17,22,.92);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    padding: calc(14px + env(safe-area-inset-top)) 16px 10px;
    border-bottom: 1px solid var(--border);
  }
  .header-row { display: flex; align-items: center; gap: 10px; min-height: 34px; }
  h1 { font-size: 21px; font-weight: 800; letter-spacing: -.02em; flex: 1; }
  .back-btn {
    background: var(--card2); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 7px 13px; font-size: 14px; font-weight: 600; cursor: pointer;
    display: none;
  }
  .seg {
    display: flex; background: var(--card); border-radius: 10px; padding: 3px;
    margin-top: 10px; border: 1px solid var(--border);
  }
  .seg button {
    flex: 1; border: 0; background: transparent; color: var(--muted);
    padding: 7px 0; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .seg button.active { background: var(--card2); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.4); }
  main { padding: 12px 14px; max-width: 640px; margin: 0 auto; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    overflow: hidden; margin-bottom: 12px;
  }
  .row {
    display: flex; align-items: center; gap: 12px;
    padding: 13px 14px; cursor: pointer; border-bottom: 1px solid var(--border);
  }
  .row:last-child { border-bottom: 0; }
  .row:active { background: var(--card2); }
  .rank { width: 26px; text-align: center; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 15px; }
  .rank.m1 { color: #ffd23e; } .rank.m2 { color: #c7cdd6; } .rank.m3 { color: #e8924a; }
  .avatar {
    width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 15px; color: #fff;
  }
  .who { flex: 1; min-width: 0; }
  .who .name { font-weight: 650; font-size: 15.5px; }
  .who .sub { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .profit { font-weight: 700; font-variant-numeric: tabular-nums; font-size: 15px; }
  .pos { color: var(--green); } .neg { color: var(--red); }
  .chev { color: var(--muted); font-size: 17px; }

  /* detail */
  .detail-head { display: flex; align-items: center; gap: 14px; padding: 16px 14px; }
  .detail-head .avatar { width: 52px; height: 52px; font-size: 20px; }
  .stat { text-align: right; }
  .stat .v { font-size: 17px; font-weight: 750; font-variant-numeric: tabular-nums; }
  .stat .l { font-size: 11px; color: var(--muted); margin-top: 1px; }
  .section-title { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 16px 2px 8px; }
  .bet { padding: 12px 14px; border-bottom: 1px solid var(--border); }
  .bet:last-child { border-bottom: 0; }
  .bet-top { display: flex; gap: 10px; align-items: flex-start; }
  .bet-title { flex: 1; font-size: 14.5px; font-weight: 550; line-height: 1.3; }
  .bet-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .badge {
    font-size: 11px; font-weight: 800; padding: 3px 9px; border-radius: 99px; flex-shrink: 0;
  }
  .badge.yes { background: rgba(23,195,123,.16); color: var(--green); }
  .badge.no  { background: rgba(240,86,79,.16); color: var(--red); }
  .bet-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
  .qty { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .pnl { font-weight: 700; font-size: 14.5px; font-variant-numeric: tabular-nums; }

  .banner {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    background: rgba(23,28,36,.95); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-top: 1px solid var(--border);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    font-size: 12px; color: var(--muted); text-align: center; line-height: 1.4;
    display: none;
  }
  .banner strong { color: var(--text); }
  .loading { text-align: center; color: var(--muted); padding: 40px 0; font-size: 14px; }
  .spinner {
    width: 22px; height: 22px; border: 2.5px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; margin: 0 auto 10px; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header>
  <div class="header-row">
    <button class="back-btn" id="backBtn" onclick="showLeaderboard()">&#8249; Back</button>
    <h1 id="title">Top Traders</h1>
  </div>
  <div class="seg" id="seg">
    <button data-tf="daily">Today</button>
    <button data-tf="weekly">Week</button>
    <button data-tf="monthly" class="active">Month</button>
    <button data-tf="all_time">All time</button>
  </div>
</header>

<main id="main"><div class="loading"><div class="spinner"></div>Loading leaderboard…</div></main>

<div class="banner" id="banner">
  <strong>Demo traders</strong> — Kalshi has no public leaderboard API.
  <span id="bannerPrices">Bet prices are live from Kalshi's market API.</span>
</div>

<script>
"use strict";

/* ---------------- deterministic RNG (matches the iOS app) ---------------- */
function fnv1a(str) {
  let h = 0xcbf29ce484222325n;
  const P = 0x100000001b3n, M = 0xffffffffffffffffn;
  for (const ch of new TextEncoder().encode(str)) { h ^= BigInt(ch); h = (h * P) & M; }
  return h;
}
function seededRng(seed) {
  let s = seed === 0n ? 0x9e3779b97f4a7c15n : seed;
  const M = 0xffffffffffffffffn;
  return (bound) => {
    s ^= s >> 12n; s &= M;
    s ^= s << 25n; s &= M;
    s ^= s >> 27n; s &= M;
    return Number(((s * 2685821657736338717n) & M) % BigInt(bound));
  };
}

/* ---------------- demo traders (fictional — see banner) ---------------- */
const BASE_TRADERS = [
  ["demo-01","QuantumEdge",18400000,"#7c5cff"],
  ["demo-02","MacroWhale",12950000,"#2f8bff"],
  ["demo-03","ThetaBurn",9310000,"#ff7847"],
  ["demo-04","PollsterPrime",6780000,"#17c37b"],
  ["demo-05","RainOrShine",4420000,"#ffb02e"],
  ["demo-06","FedWatcher",3150000,"#5ad0e6"],
  ["demo-07","LateNightArb",2240000,"#b06ae0"],
  ["demo-08","SignalNoise",1480000,"#e0567c"],
  ["demo-09","CoinFlipKing",890000,"#8ea63a"],
  ["demo-10","SlowAndSteady",615000,"#6f8291"],
];
const TF_SCALE = { daily: .004, weekly: .02, monthly: .08, all_time: 1 };

function demoTraders(tf) {
  return BASE_TRADERS.map(([id, nick, allTime, color], i) => {
    const rng = seededRng(fnv1a(id + "-" + tf));
    const jitter = 0.75 + rng(50) / 100;
    return { id, nickname: nick, rank: i + 1, color,
             profit: Math.round(allTime * TF_SCALE[tf] * jitter) };
  });
}

/* Baked-in markets used only if the live market API is unreachable too. */
const SAMPLE_MARKETS = [
  { ticker: "FED-CUT", title: "Will the Fed cut rates at the next meeting?", yes_sub_title: "", last_price: 62 },
  { ticker: "CPI-3.0", title: "Will annual CPI come in above 3.0%?", yes_sub_title: "", last_price: 41 },
  { ticker: "BTC-100K", title: "Bitcoin above $100k at end of month?", yes_sub_title: "", last_price: 55 },
  { ticker: "NYC-RAIN", title: "Will it rain in NYC tomorrow?", yes_sub_title: "", last_price: 27 },
  { ticker: "GDP-2Q", title: "Q2 GDP growth above 2.5%?", yes_sub_title: "", last_price: 48 },
  { ticker: "OSCARS-HOST", title: "Will the Oscars announce a host this quarter?", yes_sub_title: "", last_price: 71 },
  { ticker: "SHUTDOWN", title: "Government shutdown this fiscal quarter?", yes_sub_title: "", last_price: 18 },
  { ticker: "TSLA-DEL", title: "Tesla quarterly deliveries above street estimates?", yes_sub_title: "", last_price: 44 },
];

/* ---------------- data fetching ---------------- */
const state = { tf: "monthly", traders: [], demo: true, livePrices: true, view: "list", trader: null, marketsCache: null };

async function fetchJSON(url) {
  const r = await fetch(url, { headers: { accept: "application/json" } });
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}

async function fetchMarkets() {
  if (state.marketsCache) return state.marketsCache;
  const attempts = [
    "api/kalshi?path=markets&status=open&limit=60",  // Vercel proxy
    "https://api.elections.kalshi.com/trade-api/v2/markets?status=open&limit=60", // direct (needs CORS)
  ];
  for (const url of attempts) {
    try {
      const data = await fetchJSON(url);
      if (data.markets && data.markets.length) {
        const usable = data.markets.filter(m => bestYes(m) !== null)
          .sort((a, b) => (b.volume || 0) - (a.volume || 0));
        if (usable.length) {
          state.livePrices = true;
          state.marketsCache = usable;
          return usable;
        }
      }
    } catch (e) { /* try next */ }
  }
  state.livePrices = false;
  state.marketsCache = SAMPLE_MARKETS;
  return SAMPLE_MARKETS;
}

function bestYes(m) {
  if (m.last_price > 0) return m.last_price;
  if (m.yes_bid > 0 || m.yes_ask > 0) return Math.round(((m.yes_bid || 0) + (m.yes_ask || 0) + 1) / 2);
  return null;
}

async function fetchLeaderboard(tf) {
  // Kalshi's leaderboard has no official API; try the proxy's best guess,
  // then fall back to demo traders.
  try {
    const data = await fetchJSON(`api/kalshi?path=leaderboard&period=${tf}&limit=25`);
    const rows = ["leaderboard","entries","rankings","users","traders","data"]
      .map(k => data[k]).find(v => Array.isArray(v) && v.length);
    if (!rows) throw new Error("shape");
    const traders = rows.map((r, i) => {
      const nickname = r.nickname || r.username || r.handle || r.display_name || r.name;
      if (!nickname) return null;
      let profit = 0;
      if (r.profit_cents != null) profit = r.profit_cents / 100;
      else if (r.pnl_cents != null) profit = r.pnl_cents / 100;
      else profit = Number(r.profit ?? r.pnl ?? r.earnings ?? 0);
      return { id: String(r.user_id || r.id || nickname), nickname,
               rank: r.rank || r.position || i + 1, profit, color: "#2f8bff" };
    }).filter(Boolean);
    if (!traders.length) throw new Error("empty");
    state.demo = false;
    return traders.sort((a, b) => a.rank - b.rank);
  } catch (e) {
    state.demo = true;
    return demoTraders(tf);
  }
}

/* demo positions from (ideally live) markets — mirrors the iOS logic */
function demoPositions(trader, markets) {
  const rng = seededRng(fnv1a(trader.id));
  const count = Math.min(4 + rng(4), markets.length);
  const pool = markets.slice(0, 50);
  const picked = [];
  for (let i = 0; i < count && pool.length; i++) picked.push(pool.splice(rng(pool.length), 1)[0]);
  const sizeScale = Math.max(1, trader.profit / 40000);

  return picked.map(m => {
    const yes = bestYes(m) ?? 50;
    const side = rng(2) === 0 ? "YES" : "NO";
    const sidePrice = side === "YES" ? yes : 100 - yes;
    const drift = rng(29) - 14;
    const entry = Math.min(97, Math.max(3, sidePrice - drift));
    const contracts = (200 + rng(1800)) * Math.floor(Math.sqrt(sizeScale));
    return { ticker: m.ticker, title: m.title, subtitle: m.yes_sub_title || "",
             side, contracts, entry, yes };
  });
}

/* ---------------- formatting ---------------- */
function fmtMoney(v) {
  const a = Math.abs(v);
  let s;
  if (a >= 1e6) s = "$" + (a / 1e6).toFixed(1) + "M";
  else if (a >= 1e4) s = "$" + Math.round(a / 1e3) + "K";
  else s = "$" + Math.round(a).toLocaleString();
  return (v < 0 ? "-" : "+") + s;
}
const cents = v => v + "¢";
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

/* ---------------- views ---------------- */
const main = document.getElementById("main");
const banner = document.getElementById("banner");

function updateBanner() {
  banner.style.display = state.demo ? "block" : "none";
  document.getElementById("bannerPrices").textContent = state.livePrices
    ? "Bet prices are live from Kalshi's market API."
    : "Kalshi's market API is unreachable — showing sample prices.";
}

async function showLeaderboard() {
  state.view = "list";
  document.getElementById("backBtn").style.display = "none";
  document.getElementById("seg").style.display = "flex";
  document.getElementById("title").textContent = "Top Traders";
  main.innerHTML = '<div class="loading"><div class="spinner"></div>Loading leaderboard…</div>';
  const traders = await fetchLeaderboard(state.tf);
  if (state.view !== "list") return;
  state.traders = traders;
  updateBanner();
  main.innerHTML = '<div class="card">' + traders.map((t, i) => `
    <div class="row" onclick="showTrader(${i})">
      <div class="rank ${t.rank<=3?"m"+t.rank:""}">${t.rank<=3?"&#9679;":t.rank}</div>
      <div class="avatar" style="background:${t.color}">${esc(t.nickname[0].toUpperCase())}</div>
      <div class="who">
        <div class="name">${esc(t.nickname)}</div>
        <div class="sub">Rank #${t.rank}</div>
      </div>
      <div class="profit ${t.profit>=0?"pos":"neg"}">${fmtMoney(t.profit)}</div>
      <div class="chev">&#8250;</div>
    </div>`).join("") + "</div>";
}

async function showTrader(i) {
  const t = state.traders[i];
  if (!t) return;
  state.view = "detail"; state.trader = t;
  document.getElementById("backBtn").style.display = "block";
  document.getElementById("seg").style.display = "none";
  document.getElementById("title").textContent = t.nickname;
  main.innerHTML = '<div class="loading"><div class="spinner"></div>Loading live markets…</div>';

  const markets = await fetchMarkets();
  if (state.view !== "detail") return;
  const bets = demoPositions(t, markets);
  updateBanner();

  let totalPnl = 0;
  const rows = bets.map(b => {
    const cur = b.side === "YES" ? b.yes : 100 - b.yes;
    const pnl = (cur - b.entry) * b.contracts / 100;
    totalPnl += pnl;
    return { ...b, cur, pnl };
  }).sort((a, b) => Math.abs(b.pnl) - Math.abs(a.pnl));

  main.innerHTML = `
    <div class="card">
      <div class="detail-head">
        <div class="avatar" style="background:${t.color}">${esc(t.nickname[0].toUpperCase())}</div>
        <div class="who">
          <div class="sub">Rank #${t.rank}</div>
          <div class="profit ${t.profit>=0?"pos":"neg"}" style="font-size:19px">${fmtMoney(t.profit)}</div>
          <div class="sub">Profit</div>
        </div>
        <div class="stat">
          <div class="v ${totalPnl>=0?"pos":"neg"}">${fmtMoney(totalPnl)}</div>
          <div class="l">Open P/L</div>
        </div>
      </div>
    </div>
    <div class="section-title">Active Bets</div>
    <div class="card">` + rows.map(b => `
      <div class="bet">
        <div class="bet-top">
          <div>
            <div class="bet-title">${esc(b.title)}</div>
            ${b.subtitle ? `<div class="bet-sub">${esc(b.subtitle)}</div>` : ""}
          </div>
          <div class="badge ${b.side==="YES"?"yes":"no"}">${b.side}</div>
        </div>
        <div class="bet-bottom">
          <div class="qty">${b.contracts.toLocaleString()} @ ${cents(b.entry)} &nbsp;&rarr;&nbsp; now ${cents(b.cur)}</div>
          <div class="pnl ${b.pnl>=0?"pos":"neg"}">${fmtMoney(b.pnl)}</div>
        </div>
      </div>`).join("") + "</div>";
  window.scrollTo(0, 0);
}

document.getElementById("seg").addEventListener("click", e => {
  const btn = e.target.closest("button[data-tf]");
  if (!btn) return;
  document.querySelectorAll("#seg button").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  state.tf = btn.dataset.tf;
  showLeaderboard();
});

showLeaderboard();
</script>
</body>
</html>
